services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app 
      - node_modules:/app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - 8787:8787
      
    volumes:
    - ./backend:/app
    - backend_venv:/app/.venv

    env_file:
    - ./backend/.env

volumes:
  node_modules:
  backend_venv: